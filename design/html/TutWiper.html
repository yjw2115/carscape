<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>튜토리얼 눈 치우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#8FD3F4}a:hover{color:#BFE6F8}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #070B12; color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif">
  <svg width="960" height="600" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0" aria-hidden="true">
    <rect width="1440" height="600" fill="#0C1520"></rect>
    <path d="M0 330c240-30 520 10 760-10s440-30 680 10v270H0z" fill="#C8D6E0" opacity="0.14"></path>
    <path d="M940 300v-70l50-36 50 36v70z" fill="#0F1C28" stroke="#3A5468" stroke-width="2"></path>
    <rect x="975" y="250" width="30" height="50" fill="#F2A65A" opacity="0.55"></rect>
    <circle cx="990" cy="270" r="60" fill="#F2A65A" opacity="0.08"></circle>
    <path d="M940 230h100" stroke="#DDE8F0" stroke-width="8" opacity="0.4" stroke-linecap="round"></path>
    <text x="990" y="326" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#F2C08A" opacity="0.8">대피소</text>
    <path d="M70 0h1300v440H70z" fill="#E6EEF4" opacity="0.62"></path>
    <path d="M720 440L360 120a420 420 0 0 1 720 0z" fill="#0C1520" opacity="0.92"></path>
    <path d="M720 440L360 120a420 420 0 0 1 720 0" stroke="#FFFFFF" stroke-width="10" opacity="0.5" fill="none"></path>
    <path d="M720 440L1080 120" stroke="#1A232B" stroke-width="10" stroke-linecap="round"></path>
    <path d="M940 300v-70l50-36 50 36v70z" fill="#0F1C28" stroke="#3A5468" stroke-width="2"></path>
    <rect x="975" y="250" width="30" height="50" fill="#F2A65A" opacity="0.6"></rect>
    <path d="M0 0h1440v34H0z" fill="#030507"></path>
    <path d="M0 0h70l120 440H0z" fill="#030507"></path>
    <path d="M1440 0h-70l-120 440h190z" fill="#030507"></path>
    <path d="M0 440c360-40 1080-40 1440 0v160H0z" fill="#040607"></path>
    <g fill="#FFFFFF" opacity="0.7"><circle cx="420" cy="80" r="3"></circle><circle cx="560" cy="160" r="2.5"></circle><circle cx="700" cy="60" r="3"></circle><circle cx="860" cy="140" r="2"></circle><circle cx="1180" cy="200" r="3"></circle><circle cx="300" cy="260" r="2.5"></circle></g>
  </svg>

  <div style="position: absolute; top: 46px; left: 56px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #0E2232; font-weight: 600">TUTORIAL · STEP 4 / 5</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 900; color: #0A1621">대피소를 찾아라</span>
  </div>
  <div style="position: absolute; top: 46px; right: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px; background: rgba(10,22,34,0.92); border: 1px solid #24435A">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6L4 18"></path></svg>
    <span style="font-size: 14px; color: #BFE6F8">얼어붙기까지</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: #DDF2FB">14:30</span>
  </div>

  <div style="position: absolute; left: 50%; top: 350px; width: 600px; margin-left: -300px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <span style="font-size: 13px; color: #F2A65A; font-weight: 700">조수석</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 21px; color: #F2EFE8; text-shadow: 0 2px 10px rgba(0,0,0,0.95)">“대피소가 근처긴 할 텐데요… 눈이 쌓여서 아무것도 안 보이네요.”</span>
  </div>

  <div style="position: absolute; left: 56px; bottom: 30px; display: flex; gap: 12px">
    <button aria-label="나레이션 노트" style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: rgba(8,19,28,0.92); color: #BFE6F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 10h6M9 14h6M9 18h3"></path></svg>
      나레이션 노트
    </button>
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: rgba(8,19,28,0.92); color: #EEF4F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path></svg>
      힌트 2
    </button>
  </div>

  <div style="position: absolute; right: 56px; bottom: 26px; width: 300px; padding: 14px 18px; box-sizing: border-box; border-radius: 16px; background: rgba(8,12,16,0.92); border: 1px solid #2A3540; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #8FD3F4">앞유리 확보</span>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 15px">
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #F2A65A; flex-shrink: 0"></span>
      <span style="flex-grow: 1">김서림 제거</span><span style="color: #F2A65A; font-weight: 700">켜짐</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 15px">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8FD3F4; box-sizing: border-box; flex-shrink: 0"></span>
      <span style="flex-grow: 1">와이퍼 단계</span>
      <span style="font-family: 'IBM Plex Mono', monospace; color: #8FD3F4">1 → <b>3</b> → 1</span>
    </div>
  </div>
</div>
</body>
</html>
