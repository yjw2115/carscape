<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배지판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 24px 32px; gap: 18px">

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #E8A33D">BADGE COLLECTION</span>
      <span style="font-family: 'Noto Serif KR', serif; font-size: 32px; font-weight: 900">내 배지판</span>
    </div>
    <div style="display: flex; gap: 20px; font-size: 15px; color: #CFCBC2">
      <span>모은 배지 <b style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #ECEAE4">2</b> / 3 공개</span>
      <span>금색 테두리 <b style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #E8C26A">1</b></span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 17px; font-weight: 700">시즌 1 · [시즌 이름]</span>
      <div style="width: 160px; height: 6px; border-radius: 3px; background: #22252D"><div style="width: 50%; height: 100%; border-radius: 3px; background: #E8A33D"></div></div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A9A69E">2 / 4</span>
    </div>
    <div style="display: flex; gap: 14px">
      <div style="width: 150px; padding: 14px; box-sizing: border-box; border-radius: 18px; background: #15161B; border: 1px solid #3A3220; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="92" height="100" viewBox="0 0 92 100" role="img" aria-label="얼어붙은 밤 금색 배지"><path d="M46 4l40 23v46L46 96 6 73V27z" fill="#0F1B26" stroke="#E8C26A" stroke-width="5" stroke-linejoin="round"></path><path d="M46 30v40M29 40l34 20M63 40L29 60" stroke="#BFE6F8" stroke-width="4" stroke-linecap="round"></path></svg>
        <span style="font-size: 15px; font-weight: 700">얼어붙은 밤</span>
        <div style="display: flex; gap: 6px"><span style="padding: 2px 8px; border-radius: 6px; background: #E8C26A; color: #1A1408; font-size: 11px; font-weight: 700">금색</span><span style="padding: 2px 8px; border-radius: 6px; background: #C0442E; color: #FFF3E6; font-size: 11px; font-weight: 700">초판</span></div>
      </div>
      <div style="width: 150px; padding: 14px; box-sizing: border-box; border-radius: 18px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="92" height="100" viewBox="0 0 92 100" role="img" aria-label="시간당 120mm 은색 배지"><path d="M46 4l40 23v46L46 96 6 73V27z" fill="#0E1C26" stroke="#C9D2DA" stroke-width="5" stroke-linejoin="round"></path><path d="M46 28c10 14 16 22 16 30a16 16 0 0 1-32 0c0-8 6-16 16-30z" fill="#6FC3E0"></path></svg>
        <span style="font-size: 15px; font-weight: 700">시간당 120mm</span>
        <span style="padding: 2px 8px; border-radius: 6px; background: #C9D2DA; color: #15161B; font-size: 11px; font-weight: 700">은색</span>
      </div>
      <div style="width: 150px; padding: 14px; box-sizing: border-box; border-radius: 18px; background: #111216; border: 1px dashed #3A3D45; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="92" height="100" viewBox="0 0 92 100" aria-hidden="true"><path d="M46 4l40 23v46L46 96 6 73V27z" fill="#1A1B20" stroke="#3A3D45" stroke-width="4" stroke-linejoin="round"></path><text x="46" y="60" text-anchor="middle" font-family="IBM Plex Mono" font-size="26" fill="#4A4D55">?</text></svg>
        <span style="font-size: 15px; font-weight: 700; color: #A9A69E">[시나리오 3]</span>
        <a href="Detail.html" style="font-size: 13px; color: #E8A33D; text-decoration: none; font-weight: 700">도전하기 ›</a>
      </div>
      <div style="width: 150px; padding: 14px; box-sizing: border-box; border-radius: 18px; background: #0E0F12; border: 1px dashed #26282E; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="92" height="100" viewBox="0 0 92 100" aria-hidden="true"><path d="M46 4l40 23v46L46 96 6 73V27z" fill="#121317" stroke="#26282E" stroke-width="4" stroke-linejoin="round" stroke-dasharray="6 6"></path><path d="M38 52V44a8 8 0 0 1 16 0v8M34 52h24v18H34z" stroke="#3A3D45" stroke-width="3" fill="none" stroke-linejoin="round"></path></svg>
        <span style="font-size: 15px; font-weight: 700; color: #6A675F">다음 사건</span>
        <span style="font-size: 13px; color: #8A877F">[0]월 공개 예정</span>
      </div>
      <div style="flex: 1 1 0; min-width: 0; padding: 16px 18px; border-radius: 18px; background: #1A150D; border: 1px solid #4A3518; display: flex; flex-direction: column; justify-content: center; gap: 8px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #E8A33D">SEASON REWARD</span>
        <span style="font-size: 18px; font-weight: 700">시즌 4편을 모두 모으면</span>
        <span style="font-size: 15px; color: #D9C9A8; line-height: 1.5">[시즌 완성 특별 배지]<br>+ [보너스 시나리오]</span>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 12px">
      <a href="Main.html" style="height: 56px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font-size: 17px; display: flex; align-items: center; gap: 8px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        홈으로
      </a>
      <button style="height: 56px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 17px; cursor: pointer">이전 시즌 보기</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: 460px; gap: 6px 14px; font-size: 13px; color: #A9A69E">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 2px solid #8A877F; box-sizing: border-box"></span>기본 · 클리어</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 2px solid #C9D2DA; box-sizing: border-box"></span>은색 · 힌트 없이</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 2px solid #E8C26A; box-sizing: border-box"></span>금색 · 노힌트 + 빠른 기록</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #C0442E"></span>초판 · 출시 2주 내</span>
    </div>
  </div>
</div>
</body>
</html>
