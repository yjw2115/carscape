<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배지 획득</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif">
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3A3D45; font-size: 18px; border: 2px dashed #1E2026; box-sizing: border-box">[탈출 성공 결과 화면]</div>
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 68% 46%, rgba(232,194,106,0.22) 0%, rgba(5,5,7,0.9) 42%)"></div>

  <svg width="330" height="330" viewBox="0 0 460 460" style="position: absolute; right: 30px; top: 110px" role="img" aria-label="금색 테두리의 눈송이 배지, 초판 리본">
    <g stroke="#E8C26A" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <path d="M230 10v50M230 400v50M10 230h50M400 230h50M74 74l36 36M350 350l36 36M74 386l36-36M350 110l36-36"></path>
    </g>
    <path d="M230 70l130 75v150l-130 75-130-75V145z" fill="#1B1A16" stroke="#E8C26A" stroke-width="10" stroke-linejoin="round"></path>
    <path d="M230 98l106 61v122l-106 61-106-61V159z" fill="#0F1B26" stroke="#8C6E2E" stroke-width="2"></path>
    <g stroke="#BFE6F8" stroke-width="7" stroke-linecap="round">
      <path d="M230 160v140M170 195l120 70M290 195l-120 70"></path>
      <path d="M230 160l-16 -16M230 160l16 -16M230 300l-16 16M230 300l16 16M170 195l-22 -4M170 195l-6 -22M290 265l22 4M290 265l6 22M290 195l22 -4M290 195l6 -22M170 265l-22 4M170 265l-6 22" stroke-width="5"></path>
    </g>
    <circle cx="230" cy="230" r="10" fill="#E8C26A"></circle>
    <path d="M148 372h164l-14 26 14 26H148l14-26z" fill="#C0442E"></path>
    <text x="230" y="404" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#FFF3E6" letter-spacing="4">초판</text>
  </svg>

  <div style="position: absolute; left: 40px; top: 48px; width: 540px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 4px; color: #E8C26A">NEW BADGE</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 44px; font-weight: 900; line-height: 1.15; letter-spacing: -1px">새 배지를<br>획득했어요!</span>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 22px; font-weight: 700">[시나리오 이름] 배지</span>
      <span style="padding: 4px 10px; border-radius: 6px; background: #E8C26A; color: #1A1408; font-size: 13px; font-weight: 700">금색 테두리</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 16px; background: rgba(21,22,27,0.92); border: 1px solid #2A2D35; font-size: 15px">
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>클리어 · 기본 배지</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>힌트 없이 클리어 · 은색 테두리</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>제한 시간 절반 안에 · 금색 테두리</span>
      <span style="display: flex; align-items: center; gap: 10px; color: #E8A6A0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E07A6A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M7 8l5-5 5 5"></path></svg>출시 2주 안에 클리어 · 초판 리본</span>
    </div>
  </div>

  <div style="position: absolute; left: 40px; bottom: 32px; display: flex; gap: 12px">
    <a href="BadgeBook.html" style="height: 60px; padding: 0 26px; border-radius: 16px; background: #E8C26A; color: #1A1408; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-decoration: none">배지판 보기</a>
    <button style="height: 60px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 17px; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
      배지 공유
    </button>
    <button style="height: 60px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; background: transparent; color: #CFCBC2; font: inherit; font-size: 17px; cursor: pointer">결과로 돌아가기</button>
  </div>
</div>
</body>
</html>
