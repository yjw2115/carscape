<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Carscape 탈출 성공</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@600;700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: radial-gradient(ellipse at 70% 50%, #1C1710 0%, #0B0B0E 70%); color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 32px; padding: 36px 40px; align-items: center; overflow: hidden">

  <div style="flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; flex-direction: column; gap: 18px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 4px; color: #E8A33D">CASE 01 · CLOSED</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 48px; font-weight: 900; line-height: 1.15; letter-spacing: -1px">폭우 속에서<br>탈출했어요</span>
    <span style="font-size: 19px; color: #CFCBC2; line-height: 1.65">구조대가 비상등 신호를 보고 찾아왔어요.<br>현실에선 물이 차오르기 전, 창문부터 여는 것 잊지 마세요.</span>
    <div style="display: flex; gap: 12px; margin-top: auto">
      <a href="Main.html" style="height: 62px; padding: 0 30px; border-radius: 16px; background: #E8A33D; color: #1A1408; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-decoration: none; box-shadow: 0 0 32px rgba(232,163,61,0.35)">
        다음 사건 열기
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <button style="height: 62px; padding: 0 26px; border-radius: 16px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 19px; font-weight: 500; display: flex; align-items: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
        결과 카드 공유
      </button>
    </div>
  </div>

  <div style="width: 400px; flex-shrink: 0; position: relative; transform: rotate(1.5deg)">
    <div style="background: #EDE4CF; color: #2A2217; border-radius: 6px; padding: 28px 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #2A2217; padding-bottom: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 3px">CASE REPORT #01</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6A5A3C">2026.11.09 · 23:58</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; color: #6A5A3C">탈출 시간</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 36px; font-weight: 600">27:14</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; color: #6A5A3C">푼 퍼즐</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 36px; font-weight: 600">6/6</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; color: #6A5A3C">힌트</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 36px; font-weight: 600">1회</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 14px; color: #6A5A3C">사건 해결에 쓰인 이 차의 장치</span>
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px 0">
          <span style="padding: 7px 12px; border-radius: 6px; background: #2A2217; color: #EDE4CF; font-size: 14px; font-weight: 500">재난방송</span>
          <span style="width: 18px; height: 2px; background: #8A7A5C"></span>
          <span style="padding: 7px 12px; border-radius: 6px; background: #2A2217; color: #EDE4CF; font-size: 14px; font-weight: 500">비상등 SOS</span>
          <span style="width: 18px; height: 2px; background: #8A7A5C"></span>
          <span style="padding: 7px 12px; border-radius: 6px; background: #2A2217; color: #EDE4CF; font-size: 14px; font-weight: 500">안전벨트</span>
          <span style="width: 18px; height: 2px; background: #8A7A5C"></span>
          <span style="padding: 7px 12px; border-radius: 6px; background: #2A2217; color: #EDE4CF; font-size: 14px; font-weight: 500">창문</span>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px dashed #BFAF8C">
        <span style="font-size: 15px; color: #4A3A20">이번 사건 순위 <b style="font-family: 'IBM Plex Mono', monospace; font-size: 18px">상위 [N]%</b></span>
        <span style="font-size: 14px; color: #6A5A3C">익힌 생존 행동 3가지</span>
      </div>
    </div>
    <div style="position: absolute; top: -26px; right: -18px; transform: rotate(-10deg); border: 5px solid #C0442E; color: #C0442E; border-radius: 12px; padding: 8px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 38px; font-weight: 600; letter-spacing: 4px; background: rgba(237,228,207,0.6)">ESCAPED</div>
  </div>
</div>
</body>
</html>
