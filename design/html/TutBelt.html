<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>튜토리얼 출발 준비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#8FD3F4}a:hover{color:#BFE6F8}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #06101A; color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif">
  <svg width="960" height="600" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0" aria-hidden="true">
    <defs><pattern id="gb" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#10283A" stroke-width="1"></path></pattern></defs>
    <rect width="1440" height="600" fill="url(#gb)"></rect>
  </svg>

  <div style="position: absolute; top: 32px; left: 32px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #8FD3F4">TUTORIAL · STEP 5 / 5</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 900">모두 함께 출발</span>
  </div>
  <div style="position: absolute; top: 32px; right: 32px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px; background: rgba(10,22,34,0.9); border: 1px solid #24435A">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6L4 18"></path></svg>
    <span style="font-size: 14px; color: #BFE6F8">얼어붙기까지</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: #DDF2FB">12:48</span>
  </div>

  <div style="position: absolute; top: 120px; left: 32px; width: 380px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px; padding-left: 14px; border-left: 2px solid #2A4458">
      <span style="font-size: 13px; color: #8FD3F4; font-weight: 700">운전석</span>
      <span style="font-family: 'Noto Serif KR', serif; font-size: 20px; color: #EEF4F8; line-height: 1.5">“저기 대피소가 보인다! 길이 험하니까 다들 조심해. 모두 살아남는 거야!”</span>
    </div>
    <div style="padding: 16px 18px; border-radius: 16px; background: rgba(10,22,34,0.9); border: 1px solid #24435A; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #8FD3F4">지금 할 일</span>
      <span style="font-size: 17px; font-weight: 700; line-height: 1.45">탑승한 모든 자리의 <span style="color: #F2A65A">안전벨트</span>를 매고<br>운전자는 <span style="color: #F2A65A">브레이크</span>를 3초간 꾹 밟으세요</span>
      <span style="font-size: 14px; color: #A9BAC6">실제로 출발하지 않아요. 기어는 P에 그대로 두세요.</span>
    </div>
  </div>

  <svg width="500" height="268" viewBox="0 0 820 440" style="position: absolute; right: 32px; top: 150px" role="img" aria-label="좌석 4개 중 3개는 안전벨트 체결, 뒷좌석 오른쪽은 미체결, 브레이크 유지 2.1초">
    <path d="M150 30c0-14 12-26 26-26h188c14 0 26 12 26 26v380c0 14-12 26-26 26H176c-14 0-26-12-26-26z" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"></path>
    <text x="270" y="50" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#5E8AA2" letter-spacing="3">FRONT</text>
    <rect x="180" y="110" width="70" height="80" rx="14" fill="#2A1C0E" stroke="#F2A65A" stroke-width="2.5"></rect>
    <path d="M190 120l50 60" stroke="#F2A65A" stroke-width="5" stroke-linecap="round"></path>
    <rect x="290" y="110" width="70" height="80" rx="14" fill="#2A1C0E" stroke="#F2A65A" stroke-width="2.5"></rect>
    <path d="M350 120l-50 60" stroke="#F2A65A" stroke-width="5" stroke-linecap="round"></path>
    <rect x="180" y="250" width="70" height="80" rx="14" fill="#2A1C0E" stroke="#F2A65A" stroke-width="2.5"></rect>
    <path d="M190 260l50 60" stroke="#F2A65A" stroke-width="5" stroke-linecap="round"></path>
    <circle cx="325" cy="290" r="52" fill="none" stroke="#FF9A84" stroke-width="1.5" opacity="0.4"></circle>
    <rect x="290" y="250" width="70" height="80" rx="14" fill="#2A1611" stroke="#FF9A84" stroke-width="2.5"></rect>
    <path d="M350 260l-18 22M318 300l-18 22" stroke="#FF9A84" stroke-width="5" stroke-linecap="round"></path>
    <text x="215" y="210" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#F2A65A">운전석 ✓</text>
    <text x="325" y="210" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#F2A65A">조수석 ✓</text>
    <text x="215" y="350" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#F2A65A">뒷좌석 왼쪽 ✓</text>
    <text x="325" y="350" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#FF9A84">뒷좌석 오른쪽</text>

    <circle cx="640" cy="200" r="96" fill="none" stroke="#10283A" stroke-width="14"></circle>
    <circle cx="640" cy="200" r="96" fill="none" stroke="#F2A65A" stroke-width="14" stroke-linecap="round" stroke-dasharray="422 603" transform="rotate(-90 640 200)"></circle>
    <text x="640" y="196" text-anchor="middle" font-family="IBM Plex Mono" font-size="40" font-weight="600" fill="#EEF4F8">2.1</text>
    <text x="640" y="224" text-anchor="middle" font-family="Noto Sans KR" font-size="14" fill="#A9BAC6">/ 3초</text>
    <text x="640" y="330" text-anchor="middle" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#F2A65A">브레이크 유지 중</text>
    <text x="640" y="354" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#A9BAC6">안전벨트 3 / 4 · 한 자리 남았어요</text>
  </svg>

  <div style="position: absolute; left: 32px; bottom: 32px; display: flex; gap: 12px">
    <button aria-label="나레이션 노트" style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: #08131C; color: #BFE6F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 10h6M9 14h6M9 18h3"></path></svg>
      나레이션 노트
    </button>
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: #08131C; color: #EEF4F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path></svg>
      힌트 2
    </button>
  </div>
</div>
</body>
</html>
