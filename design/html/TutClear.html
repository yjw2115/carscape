<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>튜토리얼 대피소 도착</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#8FD3F4}a:hover{color:#BFE6F8}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 75% 45%, #2A1E12 0%, #0A0E14 65%); color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 28px; padding: 36px 40px; box-sizing: border-box">

  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #F2A65A">TUTORIAL COMPLETE</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 46px; font-weight: 900; line-height: 1.15; letter-spacing: -1px">대피소에<br>무사히 도착했어요</span>
    <span style="font-size: 18px; color: #C9D6DF; line-height: 1.6">“다들 수고했어. 따뜻한 데 오니까 살 것 같다.”<br>이제 이 차의 버튼으로 퍼즐을 푸는 방법을 알게 됐어요.</span>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 16px; background: #2A1C0E; border: 1px solid #6A4520; align-self: flex-start">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 3l14 6v10c0 9-6 15-14 18C12 34 6 28 6 19V9z" stroke="#F2A65A" stroke-width="2.5"></path><path d="M20 12v14M13 15l14 8M27 15l-14 8" stroke="#F2A65A" stroke-width="2" stroke-linecap="round"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 700; color: #F6DCAA">기본 훈련 완료 배지</span>
        <span style="font-size: 14px; color: #C9AE86">CASE 01 · 시간당 120mm 이 열렸어요</span>
      </div>
    </div>
    <div style="margin-top: auto; display: flex; gap: 12px">
      <a href="Briefing.html" style="height: 62px; padding: 0 28px; border-radius: 16px; background: #F2A65A; color: #1F1206; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-decoration: none; box-shadow: 0 0 30px rgba(242,166,90,0.35)">
        CASE 01 시작하기
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <a href="TutIntro.html" style="height: 62px; padding: 0 24px; border-radius: 16px; border: 1px solid #3A3D45; color: #C9D6DF; font-size: 17px; display: flex; align-items: center; text-decoration: none">다시 하기</a>
    </div>
  </div>

  <div style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <div style="padding: 18px; border-radius: 16px; background: rgba(20,26,34,0.9); border: 1px solid #262E38; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #A9BAC6">걸린 시간</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600">17:12</span>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: rgba(20,26,34,0.9); border: 1px solid #262E38; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #A9BAC6">사용한 힌트</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600">1회</span>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: rgba(20,26,34,0.9); border: 1px solid #262E38; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #A9BAC6">함께한 인원</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600">4명</span>
      </div>
    </div>
    <div style="padding: 18px 20px; border-radius: 16px; background: rgba(20,26,34,0.9); border: 1px solid #262E38; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 15px; color: #A9BAC6">이 차에서 확인된 퍼즐 장치</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 15px">
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>시트 열선 4석</span>
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>공조 · 히터</span>
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>창문 4개</span>
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>와이퍼 · 김서림 제거</span>
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>안전벨트 4석</span>
        <span style="display: flex; align-items: center; gap: 8px; color: #A9BAC6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A7E8C" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>글로브박스 (미지원)</span>
      </div>
      <span style="font-size: 13px; color: #8A9AA6">본편에서는 이 차에서 되는 장치로만 퍼즐이 나와요</span>
    </div>
  </div>
</div>
</body>
</html>
