<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>튜토리얼 얼어붙은 글로브박스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#8FD3F4}a:hover{color:#BFE6F8}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 70% 40%, #14202C 0%, #070B12 70%); color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif">

  <div style="position: absolute; top: 32px; left: 32px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #8FD3F4">TUTORIAL · STEP 2 / 5</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 900">얼어붙은 수리 도구</span>
  </div>
  <div style="position: absolute; top: 32px; right: 32px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px; background: rgba(10,22,34,0.9); border: 1px solid #24435A">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6L4 18"></path></svg>
    <span style="font-size: 14px; color: #BFE6F8">얼어붙기까지</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: #DDF2FB">24:15</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #8FD3F4">-19℃</span>
  </div>

  <div style="position: absolute; top: 132px; left: 32px; width: 360px; display: flex; flex-direction: column; gap: 14px">
    <div style="padding: 18px 20px; border-radius: 16px; background: rgba(10,22,34,0.9); border: 1px solid #24435A; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #8FD3F4">지금 할 일</span>
      <span style="font-size: 21px; font-weight: 700; line-height: 1.45">얼어붙은 글로브박스를<br><span style="color: #F2A65A">녹여서</span> 열어보세요</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #2A1C0E; border: 1px solid #6A4520">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #F2A65A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A1C0E" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
      <span style="font-size: 16px; font-weight: 500">조수석 쪽을 따뜻하게</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #0E2232; border: 1px dashed #8FD3F4">
      <div style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid #8FD3F4; box-sizing: border-box; flex-shrink: 0"></div>
      <span style="font-size: 16px; font-weight: 500">녹으면 글로브박스 열기</span>
    </div>
  </div>

  <div style="position: absolute; top: 112px; right: 32px; width: 520px; height: 171px; border-radius: 20px; background: #0A121B; border: 1px solid #1E3446; overflow: hidden">
    <svg width="520" height="171" viewBox="0 0 820 270" role="img" aria-label="조수석 앞 대시보드, 얼음으로 덮인 글로브박스가 히터 바람에 녹고 있음">
      <path d="M0 70c200-40 620-40 820 0v200H0z" fill="#111C27"></path>
      <path d="M0 70c200-40 620-40 820 0" stroke="#2A4458" stroke-width="2" fill="none"></path>
      <rect x="120" y="96" width="120" height="22" rx="6" fill="#0A121B" stroke="#2A4458"></rect>
      <path d="M134 107h92" stroke="#F2A65A" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"></path>
      <path d="M150 128c10 16 0 26 10 40M180 128c10 16 0 26 10 40M210 128c10 16 0 26 10 40" stroke="#F2A65A" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"></path>
      <text x="180" y="88" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#F2A65A">조수석 송풍구</text>
      <rect x="360" y="110" width="320" height="120" rx="14" fill="#16222E" stroke="#3A5468" stroke-width="2"></rect>
      <rect x="490" y="160" width="60" height="14" rx="7" fill="#0A121B"></rect>
      <path d="M360 124l40 30-12 30 28 46M680 130l-36 20 14 34-30 46M470 110l20 40 40-10 30 36" stroke="#CFEAF6" stroke-width="2" fill="none" opacity="0.55"></path>
      <path d="M360 110h120l-20 30-40 6-30 40-30 20z" fill="#CFEAF6" opacity="0.18"></path>
      <path d="M560 110h120v60l-30-14-40 10-30-26z" fill="#CFEAF6" opacity="0.14"></path>
      <text x="520" y="252" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#BFE6F8">글로브박스</text>
      <text x="720" y="128" font-family="IBM Plex Mono" font-size="12" fill="#5E8AA2">ICE</text>
      <rect x="720" y="136" width="70" height="8" rx="4" fill="#10283A"></rect>
      <rect x="720" y="136" width="28" height="8" rx="4" fill="#8FD3F4"></rect>
      <text x="720" y="164" font-family="IBM Plex Mono" font-size="12" fill="#F2A65A">녹는 중 60%</text>
    </svg>
  </div>

  <div style="position: absolute; top: 300px; right: 32px; width: 520px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 14px; align-items: baseline"><span style="width: 64px; flex-shrink: 0; font-size: 13px; color: #8FD3F4; font-weight: 700">운전석</span><span style="font-family: 'Noto Serif KR', serif; font-size: 17px; color: #A9BAC6">“드디어 보이네. 그런데 차가 고장 났는지 움직이질 않아… 수리 도구가 어디 있더라?”</span></div>
    <div style="display: flex; gap: 14px; align-items: baseline"><span style="width: 64px; flex-shrink: 0; font-size: 13px; color: #F2A65A; font-weight: 700">조수석</span><span style="font-family: 'Noto Serif KR', serif; font-size: 17px; color: #A9BAC6">“글로브박스에 있었을 거예요!”</span></div>
    <div style="display: flex; gap: 14px; align-items: baseline"><span style="width: 64px; flex-shrink: 0; font-size: 13px; color: #8FD3F4; font-weight: 700">운전석</span><span style="font-family: 'Noto Serif KR', serif; font-size: 20px; color: #EEF4F8">“어라, 잠겨 있잖아! …아니, 얼어 있는 건가?”</span></div>
  </div>

  <div style="position: absolute; left: 32px; bottom: 32px; display: flex; gap: 12px">
    <button aria-label="나레이션 노트" style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: #08131C; color: #BFE6F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 10h6M9 14h6M9 18h3"></path></svg>
      나레이션 노트
    </button>
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: #08131C; color: #EEF4F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path></svg>
      힌트 3
    </button>
  </div>
</div>
</body>
</html>
