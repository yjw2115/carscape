<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시나리오 상세</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 28px; padding: 28px 32px">

  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="Main.html" aria-label="뒤로" style="width: 50px; height: 50px; border-radius: 14px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #E8A33D">CASE [번호] · [카테고리]</span>
    </div>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 48px; font-weight: 900; letter-spacing: -1px">[시나리오 이름]</span>
    <span style="font-size: 18px; color: #CFCBC2; line-height: 1.65">[한두 문장 줄거리 소개. 플레이어가 어떤 상황에 놓이고, 무엇을 해야 하는지.]</span>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <div style="padding: 12px 16px; border-radius: 12px; background: #15161B; display: flex; flex-direction: column; gap: 2px; min-width: 96px"><span style="font-size: 13px; color: #8A877F">소요 시간</span><span style="font-size: 18px; font-weight: 700">[00]분</span></div>
      <div style="padding: 12px 16px; border-radius: 12px; background: #15161B; display: flex; flex-direction: column; gap: 2px; min-width: 96px"><span style="font-size: 13px; color: #8A877F">인원</span><span style="font-size: 18px; font-weight: 700">[0~0]인</span></div>
      <div style="padding: 12px 16px; border-radius: 12px; background: #15161B; display: flex; flex-direction: column; gap: 2px; min-width: 96px"><span style="font-size: 13px; color: #8A877F">난이도</span><span style="font-size: 18px; font-weight: 700; color: #E8A33D">●●○</span></div>
      <div style="padding: 12px 16px; border-radius: 12px; background: #15161B; display: flex; flex-direction: column; gap: 2px; min-width: 96px"><span style="font-size: 13px; color: #8A877F">내 최고 기록</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">--:--</span></div>
    </div>
    <div style="margin-top: auto; display: flex; gap: 12px">
      <a href="TutIntro.html" style="height: 64px; padding: 0 30px; border-radius: 16px; background: #E8A33D; color: #1A1408; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; text-decoration: none; box-shadow: 0 0 30px rgba(232,163,61,0.3)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
        시작하기
      </a>
      <button style="height: 64px; padding: 0 24px; border-radius: 16px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 17px; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16V9M12 16V5M17 16v-4"></path></svg>
        순위 보기
      </button>
    </div>
  </div>

  <div style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 180px; border-radius: 20px; border: 2px dashed #3A3D45; background: #121318; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6A675F">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
      <span style="font-size: 14px">[시나리오 대표 이미지]</span>
    </div>
    <div style="flex-grow: 1; padding: 18px 20px; border-radius: 20px; background: #15161B; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 16px; font-weight: 700">사용하는 차량 장치</span>
        <span style="font-size: 14px; color: #9BE0B8">이 차에서 플레이 가능</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 15px">
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[장치 1]</span>
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[장치 2]</span>
        <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[장치 3]</span>
        <span style="display: flex; align-items: center; gap: 8px; color: #A9A69E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>[장치 4] · 대체 퍼즐</span>
      </div>
      <span style="font-size: 13px; color: #8A877F; margin-top: auto">밖에서 보이는 장치(창문·와이퍼 등)를 쓰는 시나리오는 여기에 표시돼요</span>
    </div>
  </div>
</div>
</body>
</html>
