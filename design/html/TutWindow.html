<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>튜토리얼 창문 회로 퍼즐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#8FD3F4}a:hover{color:#BFE6F8}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #06101A; color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif">

  <div style="position: absolute; top: 32px; left: 32px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #8FD3F4">TUTORIAL · STEP 3 / 5</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 900">먹통이 된 창문 회로</span>
  </div>
  <div style="position: absolute; top: 32px; right: 32px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px; background: rgba(10,22,34,0.9); border: 1px solid #24435A">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6L4 18"></path></svg>
    <span style="font-size: 14px; color: #BFE6F8">얼어붙기까지</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: #DDF2FB">19:02</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #8FD3F4">-21℃</span>
  </div>

  <div style="position: absolute; top: 104px; left: 32px; width: 360px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px; padding-left: 14px; border-left: 2px solid #2A4458">
      <span style="font-size: 13px; color: #8FD3F4; font-weight: 700">운전석</span>
      <span style="font-family: 'Noto Serif KR', serif; font-size: 18px; color: #C9D6DF; line-height: 1.5">“공기가 좀 희박한 것 같지 않아? 어지럽네… 창문을 조금만 열어줘.”</span>
      <span style="font-family: 'Noto Serif KR', serif; font-size: 20px; color: #EEF4F8; line-height: 1.5">“…창문도 먹통이구먼.”</span>
    </div>
    <div style="padding: 16px 18px; border-radius: 16px; background: rgba(10,22,34,0.9); border: 1px solid #24435A; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #8FD3F4">지금 할 일</span>
      <span style="font-size: 17px; font-weight: 700; line-height: 1.45">네 자리의 <span style="color: #F2A65A">창문 버튼</span>으로 막대를 움직여<br>전류를 오른쪽 끝까지 보내세요</span>
      <span style="font-size: 14px; color: #A9BAC6; line-height: 1.5">자리마다 한 줄씩 움직여요. 자리를 옮겨 다니며 함께 풀어보세요.</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #2A1611; border: 1px solid #6A3528; font-size: 14px; color: #FFD9CF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF9A84" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
      창문은 절반까지만 써요 · 손과 머리가 끼지 않게 조심
    </div>
  </div>

  <div style="position: absolute; top: 110px; right: 32px; width: 520px; height: 248px; border-radius: 20px; background: #0A1621; border: 1px solid #1E3446; overflow: hidden">
    <svg width="520" height="248" viewBox="0 0 840 400" role="img" aria-label="창문 회로 퍼즐: 막대 4개 중 2개는 정렬되어 전류가 흐르고, 나머지 2개는 어긋나 있음">
      <defs><pattern id="gw" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0v20" fill="none" stroke="#10283A" stroke-width="1"></path></pattern></defs>
      <rect width="840" height="400" fill="url(#gw)"></rect>
      <path d="M30 180h780" stroke="#15324A" stroke-width="18" stroke-linecap="round"></path>
      <path d="M30 180h420" stroke="#F2A65A" stroke-width="6" stroke-linecap="round"></path>
      <circle cx="30" cy="180" r="16" fill="#2A1C0E" stroke="#F2A65A" stroke-width="3"></circle>
      <path d="M26 172l6 8-6 0 6 8" stroke="#F2A65A" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
      <circle cx="810" cy="180" r="16" fill="#0E2232" stroke="#8FD3F4" stroke-width="3"></circle>
      <text x="810" y="214" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#5E8AA2">EXIT</text>

      <rect x="130" y="24" width="70" height="116" rx="10" fill="#3A2510" stroke="#F2A65A" stroke-width="2"></rect>
      <rect x="130" y="220" width="70" height="116" rx="10" fill="#3A2510" stroke="#F2A65A" stroke-width="2"></rect>
      <rect x="300" y="24" width="70" height="116" rx="10" fill="#3A2510" stroke="#F2A65A" stroke-width="2"></rect>
      <rect x="300" y="220" width="70" height="116" rx="10" fill="#3A2510" stroke="#F2A65A" stroke-width="2"></rect>
      <rect x="470" y="24" width="70" height="56" rx="10" fill="#13283A" stroke="#8FD3F4" stroke-width="2"></rect>
      <rect x="470" y="150" width="70" height="186" rx="10" fill="#13283A" stroke="#8FD3F4" stroke-width="2"></rect>
      <path d="M505 112v-20M497 100l8-8 8 8" stroke="#8FD3F4" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
      <rect x="640" y="24" width="70" height="196" rx="10" fill="#0E1C28" stroke="#2A4458" stroke-width="2"></rect>
      <rect x="640" y="290" width="70" height="46" rx="10" fill="#0E1C28" stroke="#2A4458" stroke-width="2"></rect>

      <text x="165" y="370" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#F2A65A">운전석</text>
      <text x="335" y="370" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#F2A65A">조수석</text>
      <text x="505" y="370" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#8FD3F4">뒷좌석 왼쪽</text>
      <text x="675" y="370" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#6A7E8C">뒷좌석 오른쪽</text>
      <text x="165" y="390" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#B9A374">20% ✓</text>
      <text x="335" y="390" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#B9A374">35% ✓</text>
      <text x="505" y="390" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#8FD3F4">10% ▲</text>
      <text x="675" y="390" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#6A7E8C">0%</text>
    </svg>
  </div>

  <div style="position: absolute; left: 32px; bottom: 32px; display: flex; gap: 12px">
    <button aria-label="나레이션 노트" style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: #08131C; color: #BFE6F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 10h6M9 14h6M9 18h3"></path></svg>
      나레이션 노트
    </button>
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A4458; background: #08131C; color: #EEF4F8; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path></svg>
      힌트 2
    </button>
  </div>
</div>
</body>
</html>
