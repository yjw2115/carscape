<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모드 선택</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 24px 32px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="9" stroke="#E8A33D" stroke-width="2.5"></rect><circle cx="20" cy="17" r="5" stroke="#E8A33D" stroke-width="2.5"></circle><path d="M20 22v8" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round"></path></svg>
      <span style="font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 900">무엇을 플레이할까요?</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #13241B; border: 1px solid #2C5A40; color: #9BE0B8; font-size: 14px; font-weight: 500">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #9BE0B8"></span>P단 · 플레이 가능
    </div>
  </div>

  <div style="display: flex; gap: 16px; flex-grow: 1; min-height: 0">
    <a href="CheckIntro.html" style="flex: 1 1 0; min-width: 0; text-decoration: none; color: inherit; position: relative; border-radius: 22px; overflow: hidden; border: 2px solid #8FD3F4; background: #0A111B; box-shadow: 0 0 30px rgba(143,211,244,0.18); display: flex; flex-direction: column">
      <svg width="100%" height="190" viewBox="0 0 420 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="420" height="190" fill="#0C1520"></rect>
        <path d="M0 130c80-14 170 6 250-6s120-12 170 2v64H0z" fill="#DDE8F0" opacity="0.18"></path>
        <path d="M250 128v-34l24-18 24 18v34z" fill="#0F1C28" stroke="#3A5468" stroke-width="2"></path>
        <rect x="266" y="104" width="16" height="24" fill="#F2A65A" opacity="0.55"></rect>
        <path d="M60 140c0-10 6-15 15-17l20-14c5-4 11-5 17-5h44c8 0 14 2 19 7l14 13c11 2 18 7 18 16z" fill="#04070B"></path>
        <g fill="#FFFFFF" opacity="0.6"><circle cx="40" cy="30" r="2"></circle><circle cx="120" cy="60" r="2.5"></circle><circle cx="200" cy="24" r="2"></circle><circle cx="330" cy="50" r="2.5"></circle><circle cx="380" cy="90" r="2"></circle><circle cx="170" cy="96" r="2"></circle></g>
      </svg>
      <span style="position: absolute; top: 14px; left: 14px; padding: 5px 12px; border-radius: 8px; background: #8FD3F4; color: #06141C; font-size: 13px; font-weight: 700">처음이라면 여기서</span>
      <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #8FD3F4">TUTORIAL</span>
        <span style="font-family: 'Noto Serif KR', serif; font-size: 30px; font-weight: 900">얼어붙은 밤</span>
        <span style="font-size: 15px; color: #A9BAC6; line-height: 1.5">차의 버튼으로 퍼즐을 푸는 법을 익혀요</span>
        <div style="display: flex; gap: 6px; font-size: 13px; color: #CFE0EA; margin-top: auto">
          <span style="padding: 4px 10px; border-radius: 7px; background: #13283A">약 15분</span>
          <span style="padding: 4px 10px; border-radius: 7px; background: #13283A">2~4인</span>
          <span style="padding: 4px 10px; border-radius: 7px; background: #13283A">실패 없음</span>
        </div>
      </div>
    </a>

    <div style="flex: 1 1 0; min-width: 0; position: relative; border-radius: 22px; overflow: hidden; border: 1px solid #2A2D35; background: #111216; display: flex; flex-direction: column">
      <svg width="100%" height="190" viewBox="0 0 420 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="420" height="190" fill="#0B1218"></rect>
        <path d="M0 130c70-8 140 8 210 0s140-8 210 0v60H0z" fill="#0E2434"></path>
        <g stroke="#BFE3F2" stroke-width="1.5" opacity="0.3"><path d="M40 10l-6 18M110 40l-6 18M180 14l-6 18M250 50l-6 18M320 20l-6 18M390 60l-6 18M80 80l-6 18M220 90l-6 18M350 100l-6 18"></path></g>
      </svg>
      <div style="position: absolute; top: 0; left: 0; right: 0; height: 190px; background: rgba(11,11,14,0.55); display: flex; align-items: center; justify-content: center">
        <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; background: rgba(11,11,14,0.85); border: 1px solid #3A3D45; font-size: 14px; color: #CFCBC2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          튜토리얼을 마치면 열려요
        </div>
      </div>
      <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #8A877F">CASE 01</span>
        <span style="font-family: 'Noto Serif KR', serif; font-size: 30px; font-weight: 900; color: #A9A69E">[본편 시나리오]</span>
        <span style="font-size: 15px; color: #8A877F; line-height: 1.5">본격 방탈출 · 시간 제한과 힌트 제한</span>
        <div style="display: flex; gap: 6px; font-size: 13px; color: #8A877F; margin-top: auto">
          <span style="padding: 4px 10px; border-radius: 7px; background: #1A1B20">약 30분</span>
          <span style="padding: 4px 10px; border-radius: 7px; background: #1A1B20">[인원]</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8C26A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path></svg>
      배지판
    </button>
    <button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
      설정
    </button>
    <span style="font-size: 13px; color: #8A877F; margin-left: 6px">게임을 고르면 짧은 차량 점검 후 시작돼요</span>
  </div>
</div>
</body>
</html>
