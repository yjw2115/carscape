<!doctype html>
<html lang="ko">
<head>

    <path d="M720 30v6" stroke="#1C2630" stroke-width="4"></path>
    <path d="M0 440c360-40 1080-40 1440 0v160H0z" fill="#040607"></path>
    <path d="M0 440c360-40 1080-40 1440 0" stroke="#141B22" stroke-width="2" fill="none"></path>
    <circle cx="250" cy="660" r="210" fill="none" stroke="#0E1419" stroke-width="34"></circle>

  <div style="position: absolute; top: 46px; left: 56px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #6FC3E0">CASE 01 · CHAPTER 2 / 4</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 30px; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,0.8)">물이 차오른다</span>

  <div style="position: absolute; top: 46px; right: 56px; display: flex; gap: 10px">

      <span style="font-size: 15px; color: #BFE3F2">바깥 수위</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #DDF3FB">41cm ▲</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: rgba(42,16,12,0.82); border: 1px solid #7A3A2A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9A84" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; color: #FFD9CF">18:42</span>
    </div>
  </div>

  <div style="position: absolute; top: 120px; right: 56px; transform: rotate(3deg)">
    <div style="position: absolute; top: -12px; left: 38%; width: 90px; height: 24px; background: rgba(214,232,240,0.35); transform: rotate(-4deg)"></div>
    <div style="width: 270px; background: #EDE6D4; color: #1E1810; padding: 20px 24px 16px; border-radius: 3px; box-shadow: 0 18px 44px rgba(0,0,0,0.65); display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 3px; color: #6A5A3C">CLUE #04 · 선바이저 뒤 쪽지</span>
      <span style="font-family: 'Nanum Pen Script', cursive; font-size: 32px; line-height: 1.15">짧게 셋, 길게 셋,<br>다시 짧게 셋.</span>
      <span style="font-family: 'Nanum Pen Script', cursive; font-size: 24px; color: #8A3A26">빛으로 알려.</span>
    </div>
  </div>

  <div style="position: absolute; left: 50%; top: 360px; width: 600px; margin-left: -300px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <span style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 2px; color: #F6C97A"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F6C97A; box-shadow: 0 0 10px #F6C97A"></span>재난방송 · 87.7MHz</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 23px; line-height: 1.55; color: #F2EFE8; text-shadow: 0 2px 10px rgba(0,0,0,0.95)">“…○○지하차도 일대 고립 차량은 비상등으로 위치를 알리고, 구조를 기다리십시오…”</span>
  </div>

  <div style="position: absolute; left: 56px; bottom: 30px; display: flex; gap: 12px">
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #23485A; background: rgba(8,20,28,0.85); color: #DDF3FB; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path></svg>
      힌트 2/3
    </button>
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; border: 1px solid #2A3540; background: rgba(8,12,16,0.85); color: #ECEAE4; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7l3-3h10l3 3v12H4z"></path><path d="M4 7h16M10 11h4"></path></svg>
      단서함 3

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>
    </button>
  </div>

  <div style="position: absolute; right: 56px; bottom: 26px; width: 300px; padding: 14px 18px; box-sizing: border-box; border-radius: 16px; background: rgba(8,12,16,0.88); border: 1px solid #2A3540; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6C97A" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"></path></svg>비상등 신호</span>
      <span style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9BE0B8"><span style="width: 7px; height: 7px; border-radius: 50%; background: #9BE0B8"></span>SENSOR LIVE</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">

      <span style="width: 12px; height: 12px; border-radius: 50%; background: #F6C97A; box-shadow: 0 0 8px #F6C97A"></span>
      <span style="width: 30px; height: 12px; border-radius: 6px; background: #F6C97A; box-shadow: 0 0 8px #F6C97A; margin-left: 6px"></span>
      <span style="width: 30px; height: 12px; border-radius: 6px; background: #3A3322"></span>
      <span style="width: 30px; height: 12px; border-radius: 6px; background: #3A3322"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #3A3322; margin-left: 6px"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #3A3322"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #3A3322"></span>
    </div>
    <span style="font-size: 13px; color: #A9B4BE">4 / 9 입력됨 · 다음은 <b style="color: #F6DCAA">길게</b></span>
  </div>
</div>

</html>
