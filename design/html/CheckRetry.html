<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>감지 실패 재시도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif">
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3A3D45; font-size: 18px; border: 2px dashed #1E2026; box-sizing: border-box">[점검 진행 화면]</div>
  <div style="position: absolute; inset: 0; background: rgba(5,5,7,0.78)"></div>

  <div style="position: absolute; left: 32px; top: 50%; width: 560px; margin-top: -230px; height: 460px; box-sizing: border-box; border-radius: 22px; background: #15161B; border: 1px solid #5A3A2A; box-shadow: 0 24px 60px rgba(0,0,0,0.6); padding: 26px 28px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 60px; height: 60px; border-radius: 18px; background: #2A1611; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FF9A84" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5h.01"></path></svg>
    </div>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 900; line-height: 1.3">[내·외기 순환] 조작이<br>감지되지 않았어요</span>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: #CFCBC2">
      <span style="display: flex; gap: 8px"><span style="color: #8A877F">·</span>버튼을 끝까지 눌렀는지 확인해주세요</span>
      <span style="display: flex; gap: 8px"><span style="color: #8A877F">·</span>시동(전원)이 켜져 있어야 감지돼요</span>
      <span style="display: flex; gap: 8px"><span style="color: #8A877F">·</span>지원은 확인됐지만 신호가 늦게 들어올 수 있어요. 잠시 후 다시 눌러주세요</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8A877F">시도 2 / 3</span>
    <div style="margin-top: auto; display: flex; gap: 10px">
      <button style="height: 56px; padding: 0 22px; border-radius: 14px; border: none; background: #E8A33D; color: #1A1408; font: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>
        다시 해보기
      </button>
      <button style="height: 56px; padding: 0 18px; border-radius: 14px; border: 1px solid #2A2D35; background: #0B0B0E; color: #ECEAE4; font: inherit; font-size: 15px; cursor: pointer">이 장치 없이 진행</button>
    </div>
  </div>

  <div style="position: absolute; right: 32px; top: 50%; width: 300px; margin-top: -80px; padding: 18px; box-sizing: border-box; border-radius: 16px; background: rgba(21,22,27,0.92); border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 700">"없이 진행"을 고르면</span>
    <span style="font-size: 13px; color: #A9A69E; line-height: 1.55">게임에서 이 장치가 필요한 순간, 화면을 터치하는 방식으로 자동 전환돼요. 진행에는 문제가 없어요.</span>
  </div>
</div>
</body>
</html>
