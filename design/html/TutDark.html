<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #010203; color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif">
  <div style="position: absolute; left: 50%; top: 210px; width: 760px; margin-left: -380px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <span style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #5E7A8C">

  <span style="position: absolute; right: 32px; bottom: 40px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #2F4250">POWER LOST</span>
