<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>점검 결과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: radial-gradient(ellipse at 25% 30%, #12201A 0%, #0B0B0E 60%); color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 28px; padding: 32px 36px">
  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: #13241B; border: 2px solid #9BE0B8; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #9BE0B8">CHECK COMPLETE</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 36px; font-weight: 900; line-height: 1.25">점검이 끝났어요<br>플레이할 준비 완료!</span>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #1F1A10; border: 1px solid #5A4220; font-size: 14px; color: #E6D3AE; line-height: 1.5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
      이 차에서 지원되지 않는 장치가 1개 있어요. 필요한 순간에는 화면 터치로 대신 진행돼요.
    </div>
    <div style="margin-top: auto; display: flex; gap: 10px">
      <a href="TutIntro.html" style="height: 60px; padding: 0 26px; border-radius: 16px; background: #8FD3F4; color: #06141C; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-decoration: none; box-shadow: 0 0 28px rgba(143,211,244,0.3)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
        튜토리얼 시작
      </a>
      <a href="CheckRun.html" style="height: 60px; padding: 0 20px; border-radius: 16px; border: 1px solid #2A2D35; color: #CFCBC2; font-size: 16px; display: flex; align-items: center; text-decoration: none">다시 점검</a>
    </div>
  </div>

  <div style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; justify-content: center">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="padding: 16px; border-radius: 16px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #A9A69E">자동 점검</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600">13<span style="font-size: 16px; color: #8A877F"> / 14</span></span>
        <span style="font-size: 12px; color: #8A877F">지원되는 장치</span>
      </div>
      <div style="padding: 16px; border-radius: 16px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #A9A69E">직접 점검</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600">4<span style="font-size: 16px; color: #8A877F"> / 5</span></span>
        <span style="font-size: 12px; color: #8A877F">정상 반응</span>
      </div>
    </div>
    <div style="padding: 16px 18px; border-radius: 16px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 10px; font-size: 15px">
      <span style="font-size: 13px; color: #A9A69E">직접 점검한 항목</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[장치 A]</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[내·외기 순환]</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[장치 C]</span>
      <span style="display: flex; align-items: center; gap: 10px; color: #A9A69E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>[장치 D] · 건너뜀</span>
      <span style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BE0B8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>[장치 E]</span>
    </div>
  </div>
</div>
</body>
</html>
