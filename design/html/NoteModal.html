<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>나레이션 노트 창</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif">
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3A3D45; font-size: 18px; border: 2px dashed #1E2026; box-sizing: border-box">[플레이 중인 게임 화면]</div>
  <div style="position: absolute; inset: 0; background: rgba(5,5,7,0.72)"></div>

  <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 600px; background: #15161B; border-right: 1px solid #2A2D35; box-shadow: 20px 0 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding: 28px 32px; box-sizing: border-box; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 10h6M9 14h6M9 18h3"></path></svg>
        <span style="font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 900">나레이션 노트</span>
      </div>
      <span style="font-size: 13px; color: #8A877F">시간은 계속 흘러요</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0">
      <div style="display: flex; gap: 14px; padding: 12px 14px; border-radius: 12px; color: #8A877F">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 42px; flex-shrink: 0">00:12</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700">[화자]</span><span style="font-size: 16px">[이전 대사]</span></div>
      </div>
      <div style="display: flex; gap: 14px; padding: 12px 14px; border-radius: 12px; color: #A9A69E">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 42px; flex-shrink: 0">02:40</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700">[화자]</span><span style="font-size: 16px">[이전 대사]</span></div>
      </div>
      <div style="display: flex; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #231C12; border: 1px solid #5A4220">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 42px; flex-shrink: 0; color: #E8A33D">05:18</span>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
          <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 13px; font-weight: 700; color: #E8A33D">[화자]</span><span style="padding: 2px 8px; border-radius: 6px; background: #E8A33D; color: #1A1408; font-size: 11px; font-weight: 700">최근</span></div>
          <span style="font-family: 'Noto Serif KR', serif; font-size: 20px; line-height: 1.5; color: #F2EFE8">[가장 최근 대사. 다음에 할 일에 대한 힌트가 담겨 있어요.]</span>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
            <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #3A3022"><div style="width: 40%; height: 100%; border-radius: 2px; background: #E8A33D"></div></div>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9A86E">0:03 / 0:08</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 12px">
      <button style="height: 58px; padding: 0 24px; border-radius: 16px; border: none; background: #E8A33D; color: #1A1408; font: inherit; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>
        최근 대사 다시 듣기
      </button>
      <button style="height: 58px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; background: #0B0B0E; color: #ECEAE4; font: inherit; font-size: 17px; cursor: pointer">닫기</button>
    </div>
  </div>
</div>
</body>
</html>
