<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실패 결과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: radial-gradient(ellipse at 70% 45%, #1A1214 0%, #08080A 65%); color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 28px; padding: 36px 40px">

  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 4px; color: #E07A6A">TIME OVER</span>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 46px; font-weight: 900; line-height: 1.15; letter-spacing: -1px">아쉽게도<br>시간이 다 됐어요</span>
    <span style="font-size: 18px; color: #CFCBC2; line-height: 1.6">[시나리오별 실패 문구 한 줄]<br>조금만 더 하면 탈출할 수 있었어요.</span>
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-radius: 14px; background: #15161B; border: 1px solid #2A2D35; align-self: flex-start; max-width: 100%">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path></svg>
      <span style="font-size: 15px; color: #CFCBC2; line-height: 1.55">막힌 곳은 <b style="color: #ECEAE4">[퍼즐 이름]</b>이었어요. 다시 도전하면 그 단계부터 이어서 할 수 있어요.</span>
    </div>
    <div style="margin-top: auto; display: flex; gap: 12px">
      <button style="height: 62px; padding: 0 28px; border-radius: 16px; border: none; background: #E8A33D; color: #1A1408; font: inherit; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>
        막힌 곳부터 다시
      </button>
      <button style="height: 62px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 17px; cursor: pointer">처음부터</button>
      <a href="Main.html" style="height: 62px; padding: 0 22px; border-radius: 16px; border: 1px solid #2A2D35; color: #CFCBC2; font-size: 17px; display: flex; align-items: center; text-decoration: none">홈으로</a>
    </div>
  </div>

  <div style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center">
    <div style="padding: 20px; border-radius: 18px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 15px; color: #A9A69E">진행 상황</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="flex: 1 1 0; height: 10px; border-radius: 5px; background: #E8A33D"></span>
        <span style="flex: 1 1 0; height: 10px; border-radius: 5px; background: #E8A33D"></span>
        <span style="flex: 1 1 0; height: 10px; border-radius: 5px; background: #E8A33D"></span>
        <span style="flex: 1 1 0; height: 10px; border-radius: 5px; background: #5A2A24; border: 1px solid #E07A6A; box-sizing: border-box"></span>
        <span style="flex: 1 1 0; height: 10px; border-radius: 5px; background: #2A2D35"></span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600">3 / 5 단계</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <div style="padding: 18px; border-radius: 16px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #A9A69E">플레이 시간</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600">[00:00]</span>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: #15161B; border: 1px solid #2A2D35; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #A9A69E">사용한 힌트</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600">[0]회</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
