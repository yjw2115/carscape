<!doctype html>
<html lang="ko">
<head>

<title>튜토리얼 소개</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>

a,button{white-space:nowrap}

</style>
</head>
<body>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #070B12; color: #EEF4F8; font-family: 'Noto Sans KR', sans-serif">
  <svg width="960" height="600" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0" aria-hidden="true">
    <rect width="1440" height="600" fill="#0A111B"></rect>
    <path d="M0 360c200-30 420 10 640-10s460-40 800 0v250H0z" fill="#DDE8F0" opacity="0.10"></path>
    <path d="M0 420c260-20 520 20 760 0s420-30 680 10v170H0z" fill="#DDE8F0" opacity="0.16"></path>
    <path d="M820 380v-70l40-30 40 30v70z" fill="#0E1A26" stroke="#2A4458" stroke-width="2"></path>
    <rect x="850" y="340" width="20" height="40" fill="#F2A65A" opacity="0.35"></rect>
    <path d="M980 400c0-16 8-24 24-27l32-24c8-6 18-9 28-9h70c12 0 22 4 30 12l22 21c18 3 28 11 28 27z" fill="#04070B"></path>
    <path d="M1000 352c20-16 140-16 170 0" stroke="#DDE8F0" stroke-width="6" opacity="0.5" fill="none" stroke-linecap="round"></path>
    <g fill="#FFFFFF" opacity="0.55">

    </g>
  </svg>
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,11,18,0.97) 0%, rgba(7,11,18,0.9) 40%, rgba(7,11,18,0) 72%)"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 600px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #8FD3F4">TUTORIAL</span>
      <span style="padding: 4px 10px; border-radius: 6px; background: #13283A; color: #BFE6F8; font-size: 13px; font-weight: 700">처음이라면 여기서 시작</span>
    </div>
    <span style="font-family: 'Noto Serif KR', serif; font-size: 56px; font-weight: 900; letter-spacing: -1px; line-height: 1.1">얼어붙은 밤</span>
    <span style="font-size: 19px; color: #C9D6DF; line-height: 1.65">기상이변으로 기온이 급격히 떨어졌고, 차량이 고장 났다.<br>완전히 얼어붙기 전에 <b style="color: #EEF4F8">30분 안에</b> 차량을 고치고 탈출하라!</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px">
      <span style="padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,0.07)">약 15분</span>
      <span style="padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,0.07)">2~4인 협동</span>
      <span style="padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,0.07)">초등학생부터</span>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 6px">
      <div style="flex: 1 1 0; padding: 14px; border-radius: 14px; background: rgba(19,40,58,0.6); border: 1px solid #24435A; display: flex; flex-direction: column; gap: 6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>
        <span style="font-size: 15px; font-weight: 700">나레이션이 힌트예요</span>
        <span style="font-size: 13px; color: #A9BAC6">대사 속에 다음에 할 일이 숨어 있어요</span>
      </div>
      <div style="flex: 1 1 0; padding: 14px; border-radius: 14px; background: rgba(19,40,58,0.6); border: 1px solid #24435A; display: flex; flex-direction: column; gap: 6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="3"></rect><path d="M7 7l2-3h6l2 3"></path></svg>
        <span style="font-size: 15px; font-weight: 700">차 버튼으로 풀어요</span>
        <span style="font-size: 13px; color: #A9BAC6">열선, 창문, 와이퍼를 직접 조작해요</span>
      </div>
      <div style="flex: 1 1 0; padding: 14px; border-radius: 14px; background: rgba(19,40,58,0.6); border: 1px solid #24435A; display: flex; flex-direction: column; gap: 6px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FD3F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 10h6M9 14h6"></path></svg>
        <span style="font-size: 15px; font-weight: 700">놓쳤다면 노트</span>
        <span style="font-size: 13px; color: #A9BAC6">다시 듣고 대사를 글로 볼 수 있어요</span>
      </div>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 12px">
      <a href="TutDark.html" style="height: 64px; padding: 0 30px; border-radius: 16px; background: #8FD3F4; color: #06141C; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; text-decoration: none; box-shadow: 0 0 32px rgba(143,211,244,0.35)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
        튜토리얼 시작
      </a>
      <a href="Main.html" style="height: 64px; padding: 0 22px; border-radius: 16px; border: 1px solid #24435A; color: #C9D6DF; font-size: 17px; display: flex; align-items: center; text-decoration: none">건너뛰기</a>
      <span style="font-size: 13px; color: #8A9AA6">시작 전 실내등을 끄면 더 실감나요</span>
    </div>
  </div>
</div>

</html>
