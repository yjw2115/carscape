<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>점검 진행</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a,button{white-space:nowrap}
a{color:#E8A33D}a:hover{color:#F3BE6A}
</style>
</head>
<body>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: #0B0B0E; color: #ECEAE4; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 24px; padding: 28px 32px">
  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 3px; color: #E8A33D">VEHICLE CHECK · 2 / 5</span>
    </div>
    <div style="flex-grow: 1; border-radius: 22px; background: #15161B; border: 1px solid #3A3220; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px">
      <div style="width: 72px; height: 72px; border-radius: 20px; background: #231C12; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"></path><path d="M3 7l2 1M21 7l-2 1M12 0v1"></path></svg>
      </div>
      <span style="font-family: 'Noto Serif KR', serif; font-size: 32px; font-weight: 900; line-height: 1.3">[내·외기 순환 버튼]을<br>눌러보세요</span>
      <span style="font-size: 15px; color: #A9A69E; line-height: 1.5">[장치 위치 안내 · 예: 공조 버튼 줄에 있는 차 안 화살표 모양 버튼이에요]</span>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #0F1014; border: 1px dashed #4A3D28">
        <span style="position: relative; width: 14px; height: 14px; flex-shrink: 0"><span style="position: absolute; inset: -6px; border-radius: 50%; background: rgba(232,163,61,0.2)"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: #E8A33D"></span></span>
        <span style="font-size: 16px; color: #F2DDB4; font-weight: 500">조작을 기다리는 중…</span>
        <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8A877F">0:12</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 15px; cursor: pointer">이 항목 건너뛰기</button>
      <button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #2A2D35; background: #15161B; color: #ECEAE4; font: inherit; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 17h.01"></path></svg>
        어디 있나요?
      </button>
    </div>
  </div>

  <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; color: #A9A69E; padding: 2px 4px">점검 목록</span>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #13241B; border: 1px solid #2C5A40">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #9BE0B8; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E2418" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="font-size: 15px">[장치 A]</span><span style="margin-left: auto; font-size: 13px; color: #9BE0B8">정상</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #231C12; border: 1px solid #E8A33D">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #E8A33D; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E8A33D; display: flex; align-items: center; justify-content: center; flex-shrink: 0">2</span>
      <span style="font-size: 15px; font-weight: 700">[내·외기 순환]</span><span style="margin-left: auto; font-size: 13px; color: #E8A33D">확인 중</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #111216; border: 1px solid #22252D; color: #6A675F">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #3A3D45; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">3</span>
      <span style="font-size: 15px">다음 항목</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #111216; border: 1px solid #22252D; color: #6A675F">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #3A3D45; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">4</span>
      <span style="font-size: 15px">다음 항목</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #111216; border: 1px solid #22252D; color: #6A675F">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #3A3D45; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">5</span>
      <span style="font-size: 15px">다음 항목</span>
    </div>
    <span style="font-size: 12px; color: #6A675F; padding: 4px; line-height: 1.5">다음 항목은 차례가 되면 공개돼요</span>
  </div>
</div>
</body>
</html>
